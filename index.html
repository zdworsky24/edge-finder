<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Edge Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0c0c0d;--card:#161618;--card2:#1d1d20;--line:#2a2a2e;--text:#f3f1ea;--mut:#8f8d86;--acc:#c8f43a;--ink:#101203;--good:#c8f43a;--warn:#ffb547;--bad:#ff6363;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
  *{box-sizing:border-box}
  html,body{touch-action:manipulation}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Space Grotesk",-apple-system,system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  header{position:sticky;top:0;z-index:5;background:rgba(12,12,13,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 14px 0}
  .top{display:flex;align-items:center;gap:10px}
  h1{font-size:19px;margin:0;flex:1;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  h1 .mark{width:22px;height:22px;border-radius:6px;background:var(--acc);color:var(--ink);display:grid;place-items:center;font:700 13px var(--mono)}
  .meta{color:var(--mut);font:500 11px var(--mono);margin:6px 0 2px;letter-spacing:.02em;text-transform:uppercase}
  button{font:inherit;border:0;border-radius:8px;padding:9px 14px;background:var(--acc);color:var(--ink);font-weight:700;cursor:pointer}
  button.sec{background:transparent;color:var(--text);border:1px solid var(--line)}
  button:disabled{opacity:.5}
  #refresh{font-family:var(--mono);font-size:13px}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;background:rgba(18,18,20,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav a{flex:1;text-align:center;padding:10px 2px;color:var(--mut);text-decoration:none;font-weight:600;font-size:13px;border-radius:10px}
  nav a.on{color:var(--ink);background:var(--acc)}
  main{padding:12px 14px}
  .card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:6px;padding:12px;margin-bottom:10px}
  .card:has(.pg){border-left-color:var(--good)}
  .card:has(.pw){border-left-color:var(--warn)}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{display:inline-block;border-radius:4px;padding:3px 7px;font:700 12px var(--mono);letter-spacing:.02em}
  .pg{background:var(--good);color:var(--ink)}
  .pw{background:rgba(255,181,71,.16);color:var(--warn)}
  .pl{background:rgba(255,99,99,.16);color:var(--bad)}
  .big{font-size:17px;font-weight:700;letter-spacing:-.01em}
  .mut{color:var(--mut);font-size:13px}
  .price{font-family:var(--mono);font-weight:700;color:var(--acc)}
  .lnk{color:var(--acc);font-size:13px;text-decoration:none;font-weight:700}
  .grow{flex:1}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th{font:600 11px var(--mono);color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
  th,td{padding:7px;border-bottom:1px dashed var(--line);text-align:center;white-space:nowrap}
  td{font-family:var(--mono)}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-family:"Space Grotesk",sans-serif}
  td.best{color:var(--ink);background:var(--acc);font-weight:700;border-radius:4px}
  .scroll{overflow-x:auto}
  label{display:block;margin:10px 0 4px;font-weight:600}
  input[type=text],input[type=password],input[type=number],select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0a0a0b;color:var(--text);font:inherit}
  input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
  .chk{display:flex;align-items:center;gap:8px;margin:6px 0;font-weight:400}
  .chk input{width:18px;height:18px;accent-color:var(--acc)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
  .err{background:rgba(255,99,99,.1);border:1px solid rgba(255,99,99,.4);color:#ffb8b8;border-radius:8px;padding:10px;margin-bottom:10px;font-size:13px}
  .empty{color:var(--mut);text-align:center;padding:36px 10px}
  .filters{display:flex;gap:8px;margin-bottom:10px}
  .filters select{flex:1}
  .stake td,.stake th{text-align:left}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px}

  .chip{flex:0 0 auto;padding:6px 11px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--mut);font:600 12px var(--mono)}
  .chip.on{background:var(--text);border-color:var(--text);color:var(--bg)}
  .fpanel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:10px}
  .fpanel summary{font-weight:700;cursor:pointer}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
  .fgrid label{margin:8px 0 3px;font-size:13px}
  .fgrid .full{grid-column:1/-1}
  .hide{background:none;border:0;color:var(--mut);font-size:12px;padding:2px 4px;font-weight:600}
  .sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom))}
  .card[data-gk],tr[data-gk]{cursor:pointer;-webkit-tap-highlight-color:rgba(200,244,58,.2)}
  button.cmp{padding:5px 10px;font-size:12px;border-radius:6px}
  td.pos{color:var(--good);font-weight:700} td.neg{color:var(--bad)}
  tr.pick td{background:rgba(200,244,58,.1)}
  .sheet th:first-child,.sheet td:first-child{background:var(--bg)}

  .stat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  #toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30}
  #toast div{background:var(--text);color:var(--bg);font-weight:700;padding:10px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .btnrow{display:flex;gap:6px;flex-wrap:wrap}
  .btnrow button{padding:7px 11px;font-size:13px}
  .won{color:var(--good)} .lost{color:var(--bad)}
  hr{border:0;border-top:1px dashed var(--line);margin:10px 0}
</style>

<body>
<header>
  <div class="top">
    <h1><span class="mark">E</span>Edge Finder</h1>
    <button class="sec" id="gear" aria-label="Settings" style="padding:9px 11px">⚙</button>
    <button id="refresh">Refresh</button>
  </div>
  <div class="meta" id="meta">No data yet. Add your API key in Settings, then tap Refresh.</div>
  <div class="chips" id="win"></div>
</header>
<nav id="tabs">
    <a href="#ev" data-t="ev" class="on">+EV</a>
    <a href="#arbs" data-t="arbs">Arbs</a>
    <a href="#middles" data-t="middles">Middles</a>
    <a href="#odds" data-t="odds">Odds</a>
    <a href="#bets" data-t="bets">Bets</a>
  </nav>
<main>
  <div id="fbar"></div>
  <div id="sheet"></div>
  <div id="errors"></div>
  <section id="v-ev"></section>
  <section id="v-arbs" hidden></section>
  <section id="v-middles" hidden></section>
  <section id="v-odds" hidden></section>
  <section id="v-bets" hidden></section>
  <section id="v-setup" hidden></section>
  <div id="toast"></div>
</main>

<script>
/* ---------- config ---------- */
const BOOKS = [
  {key:'draftkings',     name:'DraftKings', short:'DK'},
  {key:'fanduel',        name:'FanDuel',    short:'FD'},
  {key:'betmgm',         name:'BetMGM',     short:'MGM'},
  {key:'williamhill_us', name:'Caesars',    short:'CZR'},
  {key:'fanatics',       name:'Fanatics',   short:'FAN'},
  {key:'hardrockbet',    name:'Hard Rock',  short:'HR'},
  {key:'novig',          name:'Novig',      short:'NOV'},
  {key:'kalshi',         name:'Kalshi',     short:'KAL'},
  {key:'polymarket',     name:'Polymarket', short:'PM'},
  // more US-licensed books
  {key:'betrivers',      name:'BetRivers',     short:'BR',    grp:'us'},
  {key:'espnbet',        name:'theScore Bet',  short:'SCR',   grp:'us'},
  {key:'ballybet',       name:'Bally Bet',     short:'BALY',  grp:'us'},
  {key:'betparx',        name:'betPARX',       short:'PARX',  grp:'us'},
  {key:'fliff',          name:'Fliff',         short:'FLF',   grp:'us'},
  // more exchanges / prediction markets
  {key:'polymarket_us',  name:'Polymarket US', short:'PMUS',  grp:'ex'},
  {key:'prophetx',       name:'ProphetX',      short:'PX',    grp:'ex'},
  {key:'betopenly',      name:'BetOpenly',     short:'OPN',   grp:'ex'},
  {key:'limitless',      name:'Limitless',     short:'LIM',   grp:'ex'},
  // offshore: price reference only, not licensed in Illinois
  {key:'lowvig',         name:'LowVig',        short:'LOWV',  grp:'off'},
  {key:'betonlineag',    name:'BetOnline',     short:'BOL',   grp:'off'},
  {key:'bovada',         name:'Bovada',        short:'BOV',   grp:'off'},
  {key:'betus',          name:'BetUS',         short:'BUS',   grp:'off'},
  {key:'mybookieag',     name:'MyBookie',      short:'MYB',   grp:'off'},
  {key:'betanysports',   name:'BetAnything',   short:'BANY',  grp:'off'},
];
const MINE=['draftkings','fanduel','betmgm','williamhill_us','fanatics','hardrockbet','novig','kalshi','polymarket'];
BOOKS.forEach(b=>b.grp=b.grp||(['novig','kalshi','polymarket'].includes(b.key)?'ex':'us'));
const SHARP = {key:'pinnacle', name:'Pinnacle', short:'PIN'}; // fair-price reference only
const SPORTS = [
  {key:'americanfootball_nfl',   name:'NFL'},
  {key:'americanfootball_ncaaf', name:'NCAAF'},
  {key:'basketball_nba',         name:'NBA'},
  {key:'basketball_ncaab',       name:'NCAAB'},
  {key:'icehockey_nhl',          name:'NHL'},
  {key:'baseball_mlb',           name:'MLB'},
];
const MARKETS = [{key:'h2h',name:'Moneyline'},{key:'spreads',name:'Spreads'},{key:'totals',name:'Totals'}];
const bookName = k => (BOOKS.find(b=>b.key===k)||(k===SHARP.key?SHARP:{name:k})).name;
const bookShort = k => (BOOKS.find(b=>b.key===k)||(k===SHARP.key?SHARP:{short:k})).short;

/* ---------- settings (saved in this browser only) ---------- */
const DEFAULTS = {
  apiKey:'', sports:['americanfootball_nfl','americanfootball_ncaaf','basketball_nba','basketball_ncaab','icehockey_nhl'],
  books:MINE.slice(), watch:BOOKS.map(b=>b.key).filter(k=>!MINE.includes(k)), markets:['h2h','spreads','totals'],
  minEV:2, bankroll:100, kellyFrac:0.25, kalshiFee:true, fees:{novig:0,polymarket:0}, includeLive:false,
  autoSec:0, maxAgeMin:15, windowH:0, unit:10, middleMaxLoss:2, alerts:true, hoursPerDay:8
};
function load(){ try{ return Object.assign({},DEFAULTS,JSON.parse(localStorage.getItem('edgefinder')||'{}')); }catch(e){ return {...DEFAULTS}; } }
function save(){ try{ localStorage.setItem('edgefinder',JSON.stringify(S)); }catch(e){} }
let S = load();
S.watch=(S.watch||[]).filter(k=>!S.books.includes(k));
const pullBooks=()=>[...new Set([...S.books,...S.watch,SHARP.key])];
const isWatch=k=>S.watch.includes(k);
const FDEF={sport:'all',market:'all',books:[],minEV:1,maxEV:'',minOdds:'',maxOdds:'',q:'',sort:'best',pinOnly:false,minArb:0};
S.F=Object.assign({},FDEF,S.F||{}); S.hidden=S.hidden||[];
const activeBooks=()=>S.F.books.length?S.books.filter(b=>S.F.books.includes(b)):S.books;
const passGame=(ev,market)=>(S.F.sport==='all'||ev._sport===S.F.sport)&&(S.F.market==='all'||market===S.F.market)&&
  (!S.F.q||(ev.home_team+' '+ev.away_team).toLowerCase().includes(S.F.q.toLowerCase()));
const passOdds=am=>(S.F.minOdds===''||am>=+S.F.minOdds)&&(S.F.maxOdds===''||am<=+S.F.maxOdds);
const byTime=(a,b)=>new Date(a.commence_time)-new Date(b.commence_time);
let EVENTS = [];
let CUR = new Map();       // groups currently on screen (for tap-to-detail)
let pendingRender=false;
const gk=g=>g.ev.id+'|'+g.gkey;           // raw events from the API
let lastInfo = null;       // {time, remaining, used, demo}

/* ---------- odds math ---------- */
const amToDec = a => a>0 ? 1+a/100 : 1+100/(-a);
const decToAm = d => d>=2 ? '+'+Math.round((d-1)*100) : String(Math.round(-100/(d-1)));
const fmtAm = a => (a>0?'+':'')+a;
const fmtPt = p => (p>0?'+':'')+p;
// Price after fees, as decimal odds
function effDec(book, dec){
  if(book==='kalshi' && S.kalshiFee){ const p=1/dec; return 1/(p+0.07*p*(1-p)); } // Kalshi taker fee ≈ 7%·P·(1−P) per contract
  const f = (S.fees && S.fees[book]) || 0;               // % of winnings
  return 1+(dec-1)*(1-f/100);
}

/* ---------- turn API events into comparable markets ---------- */
function buildGroups(events){
  const out=[];
  for(const ev of events){
    const map=new Map();
    for(const bk of ev.bookmakers||[]){
      for(const mk of bk.markets||[]){
        const outs=mk.outcomes||[]; let gkey,label,nameOf;
        if(mk.key==='h2h'){ gkey='h2h'; label='Moneyline'; nameOf=o=>o.name; }
        else if(mk.key==='spreads'){
          const h=outs.find(o=>o.name===ev.home_team); if(!h||h.point==null) continue;
          gkey='spreads|'+h.point; label='Spread'; nameOf=o=>o.name+' '+fmtPt(o.point);
        } else if(mk.key==='totals'){
          const o0=outs[0]; if(!o0||o0.point==null) continue;
          gkey='totals|'+o0.point; label='Total '+o0.point; nameOf=o=>o.name+' '+o.point;
        } else continue;
        const point=mk.key==='h2h'?null:(mk.key==='spreads'?outs.find(o=>o.name===ev.home_team).point:outs[0].point);
        if(!map.has(gkey)) map.set(gkey,{ev,market:mk.key,gkey,label,point,names:[],prices:{}});
        const g=map.get(gkey);
        const upd=new Date(mk.last_update||bk.last_update||Date.now()).getTime();
        for(const o of outs){
          const n=nameOf(o); if(!g.names.includes(n)) g.names.push(n);
          const dec=amToDec(o.price);
          (g.prices[bk.key] ||= {})[n]={am:o.price,dec,eff:effDec(bk.key,dec),link:o.link||mk.link||bk.link||null,upd,raw:o};
        }
      }
    }
    out.push(...map.values());
  }
  return out;
}
const isLive = ev => new Date(ev.commence_time).getTime() <= Date.now();
const ageSec = q => Math.max(0,(Date.now()-q.upd)/1000);
const fresh = q => !S.maxAgeMin || ageSec(q) <= S.maxAgeMin*60;
const ageTxt = q => { const s=ageSec(q); return s<60?`${Math.round(s)}s ago`:s<3600?`${Math.round(s/60)}m ago`:`${Math.round(s/3600)}h ago`; };
const holdPct = (g,b) => { if(!g.names.every(n=>g.prices[b]&&g.prices[b][n])) return null; return (g.names.reduce((a,n)=>a+1/g.prices[b][n].dec,0)-1)*100; };

// Fair (no-vig) probabilities: Pinnacle if it has the market, else average of devigged books (needs 3+)
function fair(g){
  const n=g.names, full=b=>n.every(x=>g.prices[b]&&g.prices[b][x]);
  const devig=b=>{ const inv=n.map(x=>1/g.prices[b][x].dec), s=inv.reduce((a,c)=>a+c,0); return inv.map(v=>v/s); };
  if(full(SHARP.key)) return {probs:devig(SHARP.key),src:'Pinnacle'};
  const bs=Object.keys(g.prices).filter(full);
  if(bs.length<3) return null;
  const sum=n.map(()=>0); bs.forEach(b=>devig(b).forEach((p,i)=>sum[i]+=p));
  return {probs:sum.map(v=>v/bs.length),src:`market avg of ${bs.length}`};
}

function findEV(groups,thr=S.F.minEV){
  const res=[];
  for(const g of groups){
    if(!S.includeLive && isLive(g.ev)) continue;
    const f=fair(g); if(!f) continue;
    g.names.forEach((n,i)=>{
      const p=f.probs[i];
      for(const b of activeBooks()){
        const q=g.prices[b]&&g.prices[b][n]; if(!q||!fresh(q)) continue;
        const ev=(p*q.eff-1)*100;
        if(ev>=thr){
          const k=Math.max(0,(p*q.eff-1)/(q.eff-1));
          res.push({g,name:n,book:b,q,ev,fairProb:p,fairSrc:f.src,stake:S.bankroll*k*S.kellyFrac});
        }
      }
    });
  }
  return res.sort((a,b)=>b.ev-a.ev);
}

function findArbs(groups){
  const res=[];
  for(const g of groups){
    if(!S.includeLive && isLive(g.ev)) continue;
    if(g.names.length<2) continue;
    const legs=g.names.map(n=>{
      let best=null;
      for(const b of activeBooks()){ const q=g.prices[b]&&g.prices[b][n]; if(q&&fresh(q)&&(!best||q.eff>best.q.eff)) best={book:b,q,name:n}; }
      return best;
    });
    if(legs.some(l=>!l)) continue;
    const sum=legs.reduce((a,l)=>a+1/l.q.eff,0);
    if(sum<1 && new Set(legs.map(l=>l.book)).size>1){
      const B=S.bankroll;
      legs.forEach(l=>{ l.stake=B*(1/l.q.eff)/sum; });
      res.push({g,legs,profitPct:(1/sum-1)*100,payout:B/sum});
    }
  }
  return res.sort((a,b)=>b.profitPct-a.profitPct);
}

// Middles: two sides at different numbers where both bets can win (e.g. Over 44.5 + Under 46.5)
function findMiddles(groups){
  const res=[], byEv=new Map();
  for(const g of groups){ if(g.market==='h2h') continue; if(!S.includeLive&&isLive(g.ev)) continue;
    (byEv.get(g.ev.id)||byEv.set(g.ev.id,[]).get(g.ev.id)).push(g); }
  const bestLeg=(g,n)=>{ let best=null; for(const b of activeBooks()){ const q=g.prices[b]&&g.prices[b][n]; if(q&&fresh(q)&&(!best||q.eff>best.q.eff)) best={book:b,q,name:n,g}; } return best; };
  for(const gs of byEv.values()){
    for(const mkt of ['totals','spreads']){
      const list=gs.filter(g=>g.market===mkt);
      for(const lo of list) for(const hi of list){
        // totals: Over at the lower number + Under at the higher number
        // spreads: home at the bigger +points + away at the smaller home number
        let a,b,width;
        if(mkt==='totals'){ if(hi.point<=lo.point) continue; a=bestLeg(lo,lo.names.find(n=>n.startsWith('Over'))); b=bestLeg(hi,hi.names.find(n=>n.startsWith('Under'))); width=hi.point-lo.point; }
        else { if(hi.point<=lo.point) continue; const home=hi.ev.home_team;
          a=bestLeg(hi,hi.names.find(n=>n.startsWith(home))); b=bestLeg(lo,lo.names.find(n=>!n.startsWith(home))); width=hi.point-lo.point; }
        if(!a||!b) continue;
        const sum=1/a.q.eff+1/b.q.eff, B=S.bankroll, P=B/sum;
        const miss=P-B, hit=a.q.eff*(B/a.q.eff/sum)+b.q.eff*(B/b.q.eff/sum)-B;
        if(miss/B*100 >= -S.middleMaxLoss) res.push({ev:lo.ev,mkt,legs:[a,b],width,miss,hit,
          stakes:[B/a.q.eff/sum,B/b.q.eff/sum]});
      }
    }
  }
  return res.sort((x,y)=>(y.miss-x.miss)||(y.width-x.width));
}

/* ---------- data ---------- */
async function refresh(){
  const btn=document.getElementById('refresh'), errs=[];
  if(!S.apiKey){ showTab('setup'); setErr(['Add your API key first.']); return; }
  btn.disabled=true; btn.textContent='Loading…';
  const books=pullBooks().join(',');   // every 10 books = billed as 1 region
  const all=[]; let rem=null,used=null;
  await Promise.all(S.sports.map(async sp=>{
    const url=`https://api.the-odds-api.com/v4/sports/${sp}/odds/?apiKey=${encodeURIComponent(S.apiKey)}&bookmakers=${books}&markets=${S.markets.join(',')}&oddsFormat=american&includeLinks=true`;
    try{
      const r=await fetch(url);
      rem=r.headers.get('x-requests-remaining')??rem; used=r.headers.get('x-requests-used')??used;
      if(!r.ok){ let m=''; try{m=(await r.json()).message||'';}catch(e){} throw new Error(`${r.status} ${m}`); }
      const data=await r.json(); data.forEach(e=>e._sport=sp); all.push(...data);
    }catch(e){ errs.push(`${sportName(sp)}: ${e.message||e}`); }
  }));
  EVENTS=all; lastInfo={time:new Date(),remaining:rem,used,demo:false};
  btn.disabled=false; btn.textContent='Refresh';

/* ---------- new-edge alerts ---------- */
let seen=null, newKeys=new Set();
const evKey=x=>`ev|${x.g.ev.id}|${x.g.gkey}|${x.name}|${x.book}`;
const arbKey=a=>`arb|${a.g.ev.id}|${a.g.gkey}|${a.legs.map(l=>l.book).join(',')}`;
function checkNew(groups){
  const keys=new Set([...findEV(groups,S.minEV).filter(x=>!S.hidden.includes(evKey(x))).map(evKey),...findArbs(groups).filter(a=>!S.hidden.includes(arbKey(a))).map(arbKey)]);
  if(seen){ newKeys=new Set([...keys].filter(k=>!seen.has(k))); if(newKeys.size && S.alerts) alertUser(newKeys.size); }
  seen=keys;
  // re-render cards so NEW badges show
  if(!document.getElementById('sheet').innerHTML){ renderEV(groups); renderArbs(groups); bindTaps(); }
}
let actx=null;
function beep(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(),gn=actx.createGain();
  o.frequency.value=880; gn.gain.value=0.15; o.connect(gn); gn.connect(actx.destination); o.start(); o.stop(actx.currentTime+0.18);}catch(e){} }
function alertUser(n){
  beep(); try{ navigator.vibrate&&navigator.vibrate(200); }catch(e){}
  try{ if(window.Notification&&Notification.permission==='granted') new Notification('Edge Finder',{body:`${n} new edge${n>1?'s':''} found`}); }catch(e){}
  const t=document.title; document.title=`(${n}) new edges`; setTimeout(()=>document.title=t,8000);
}

/* ---------- bet detail sheet ---------- */
function bindTaps(){
  document.querySelectorAll('main section [data-gk]').forEach(el=>{
    el.onclick=e=>{
      const t=e.target;
      if(t.closest('a,input,select,summary,label')||(t.closest('button')&&!t.closest('[data-cmp],[data-log]'))) return;
      const g=CUR.get(el.dataset.gk); if(!g) return;
      if(t.closest('[data-log]')) openLog(g,el.dataset.n,el.dataset.b); else openDetail(g,el.dataset.n,el.dataset.b||null);
    };
  });
}
function openDetail(g,name,pick){
  const f=fair(g), i=g.names.indexOf(name), p=f?f.probs[i]:null;
  const rows=pullBooks().filter(b=>g.prices[b]&&g.prices[b][name]).map(b=>({b,q:g.prices[b][name]}));
  const bettable=rows.filter(r=>S.books.includes(r.b)).sort((a,c)=>c.q.eff-a.q.eff);
  const watched=rows.filter(r=>isWatch(r.b)).sort((a,c)=>c.q.eff-a.q.eff);
  if(!pick&&bettable.length) pick=bettable[0].b;
  const P=g.prices[pick]&&g.prices[pick][name];
  const avg=bettable.length?bettable.reduce((a,r)=>a+(r.q.eff-1),0)/bettable.length:null;
  const pct=v=>(v>=0?'+':'')+v.toFixed(1)+'%';
  const ordered=[...bettable,...watched,...rows.filter(r=>r.b===SHARP.key)];
  const other=g.names.filter(n=>n!==name);
  document.getElementById('sheet').innerHTML=`<div class="sheetbg" id="sbg"><div class="sheet">
    <div class="row"><div class="grow mut">${gameLine(g.ev)}</div><button class="sec" id="sclose">Close</button></div>
    <div class="big" style="margin:8px 0 2px">${esc(name)} <span class="mut">· ${esc(g.label)}</span></div>
    ${P?`<div>Your pick: <span class="price">${fmtAm(P.am)}</span> at <b>${esc(bookName(pick))}</b>
      ${p!=null?` · <b class="${(p*P.eff-1)>=0?'pos':'neg'}" style="color:${(p*P.eff-1)>=0?'var(--good)':'var(--bad)'}">${pct((p*P.eff-1)*100)} EV</b>`:''}</div>`:''}
    <div class="mut" style="margin:4px 0 10px">${f?`Fair price ${decToAm(1/p)} · ${(p*100).toFixed(1)}% to win · from ${esc(f.src)}`:'Not enough books to set a fair price.'}
      ${P&&avg?` · pays ${pct(((P.eff-1)/avg-1)*100)} more profit than the average book`:''}</div>
    <div class="scroll"><table>
      <tr><th>Book</th><th>Odds</th><th>EV</th><th>Edge vs</th><th>Hold</th><th>Updated</th></tr>
      ${ordered.map(({b,q})=>{ const ev=p!=null?(p*q.eff-1)*100:null; const vs=P&&b!==pick?((P.eff-1)/(q.eff-1)-1)*100:null; const h=holdPct(g,b);
        return `<tr class="${b===pick?'pick':''}"><td>${esc(bookName(b))}${b===SHARP.key?' <span class="mut">(ref)</span>':isWatch(b)?' <span class="mut">(watch)</span>':''}</td>
          <td>${fmtAm(q.am)}${q.eff!==q.dec?`<div class="mut">${decToAm(q.eff)} after fee</div>`:''}</td>
          <td class="${ev==null?'':ev>=0?'pos':'neg'}">${ev==null?'–':pct(ev)}</td>
          <td class="${vs==null?'':vs>=0?'pos':'neg'}">${b===pick?'your pick':vs==null?'–':pct(vs)}</td>
          <td class="mut">${h==null?'–':h.toFixed(1)+'%'}</td><td class="mut">${ageTxt(q)}</td></tr>`;}).join('')}
    </table></div>
    <div class="mut" style="margin-top:8px">"Edge vs" = how much more profit your pick pays than that book on a win. Tap a row to make it your pick.</div>
    ${other.length?`<hr><div class="mut">Other side: ${other.map(n=>{ const best=S.books.map(b=>g.prices[b]&&g.prices[b][n]?{b,q:g.prices[b][n]}:null).filter(Boolean).sort((a,c)=>c.q.eff-a.q.eff)[0];
      return `${esc(n)} best ${best?fmtAm(best.q.am)+' at '+esc(bookName(best.b)):'–'}`;}).join(' · ')}</div>`:''}
    <div class="row" style="margin-top:12px">${P?`<button id="slog">Log this bet</button>`:''}${P&&P.link?`<a class="lnk" href="${esc(P.link)}" target="_blank" rel="noopener">Open ${esc(bookName(pick))} ›</a>`:''}</div>
  </div></div>`;
  const sl=document.getElementById('slog'); if(sl) sl.onclick=()=>openLog(g,name,pick);
  const close=()=>{ document.getElementById('sheet').innerHTML=''; if(pendingRender){ pendingRender=false; render(); } };
  document.getElementById('sclose').onclick=close;
  document.getElementById('sbg').onclick=e=>{ if(e.target.id==='sbg') close(); };
  document.querySelectorAll('#sheet tr').forEach((tr,k)=>{ const r=ordered[k-1]; if(r&&S.books.includes(r.b)){ tr.style.cursor='pointer'; tr.onclick=()=>openDetail(g,name,r.b);} });
}

/* ================= BET LOG ================= */
const ARBMAP=new Map(), MIDMAP=new Map();
let BETS=(()=>{ try{ return JSON.parse(localStorage.getItem('edgefinder_bets')||'[]'); }catch(e){ return []; } })();
const saveBets=()=>{ try{ localStorage.setItem('edgefinder_bets',JSON.stringify(BETS)); }catch(e){} };
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(msg){ const t=document.getElementById('toast'); t.innerHTML=`<div>${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>t.innerHTML='',2200); }
const closeSheet=()=>{ document.getElementById('sheet').innerHTML=''; if(pendingRender){ pendingRender=false; render(); } };

function makeBet(g,name,book,am,stake,tag){
  const f=fair(g), i=g.names.indexOf(name), p=f?f.probs[i]:null, dec=amToDec(am), eff=effDec(book,dec);
  return {id:uid(), created:Date.now(), evId:g.ev.id, sport:g.ev._sport, commence:g.ev.commence_time, home:g.ev.home_team, away:g.ev.away_team,
    market:g.market, gkey:g.gkey, label:g.label, point:g.point, name, book, am, dEff:eff, stake:+stake,
    fairAtLog:p, evAtLog:p!=null?(p*eff-1)*100:null, closeFair:null, closeAt:null, status:'open', profit:0, tag:tag||'ev'};
}
function suggestStake(g,name,book){
  const f=fair(g), q=g.prices[book]&&g.prices[book][name];
  if(f&&q){ const p=f.probs[g.names.indexOf(name)], k=(p*q.eff-1)/(q.eff-1); if(k>0){ const st=S.bankroll*k*S.kellyFrac; if(st>=1) return Math.round(st); } }
  return S.unit||10;
}
function openLog(g,name,book){
  const q=g.prices[book]&&g.prices[book][name]; if(!q) return;
  document.getElementById('sheet').innerHTML=`<div class="sheetbg" id="sbg"><div class="sheet">
    <div class="row"><div class="grow big">Log bet</div><button class="sec" id="sclose">Cancel</button></div>
    <div class="mut" style="margin:6px 0">${gameLine(g.ev)}</div>
    <div class="big">${esc(name)} <span class="mut">· ${esc(g.label)} · ${esc(bookName(book))}</span></div>
    <div class="fgrid">
      <div><label for="lg_odds">Odds you got</label><input id="lg_odds" type="number" step="1" value="${q.am}"></div>
      <div><label for="lg_stake">Stake ($)</label><input id="lg_stake" type="number" step="1" value="${suggestStake(g,name,book)}"></div>
    </div>
    <div class="mut" style="margin-top:6px">Change the odds if the price moved before you placed it, so your log stays accurate.</div>
    <button id="lg_save" style="width:100%;margin-top:12px">Save to bet log</button>
  </div></div>`;
  document.getElementById('sclose').onclick=closeSheet;
  document.getElementById('sbg').onclick=e=>{ if(e.target.id==='sbg') closeSheet(); };
  document.getElementById('lg_save').onclick=()=>{
    const am=parseInt(document.getElementById('lg_odds').value), st=parseFloat(document.getElementById('lg_stake').value);
    if(!am||Math.abs(am)<100||!(st>0)) return toast('Enter valid odds (e.g. -110, +150) and stake');
    BETS.unshift(makeBet(g,name,book,am,st,'ev')); saveBets(); closeSheet(); toast('Logged ✓'); if(curTab==='bets') renderBets();
  };
}
function logLegs(legs,stakes,g0,tag){
  legs.forEach((l,i)=>{ const g=l.g||g0; BETS.unshift(makeBet(g,l.name,l.book,l.q.am,Math.round(stakes[i]*100)/100,tag)); });
  saveBets(); toast(`Logged ${legs.length} bets ✓`);
}
document.addEventListener('click',e=>{
  const a=e.target.closest&&e.target.closest('[data-arb]'); if(a){ const x=ARBMAP.get(a.dataset.arb); if(x) logLegs(x.legs,x.legs.map(l=>l.stake),x.g,'arb'); return; }
  const m=e.target.closest&&e.target.closest('[data-mid]'); if(m){ const x=MIDMAP.get(m.dataset.mid); if(x) logLegs(x.legs,x.stakes,null,'middle'); }
});

/* CLV: keep the latest fair price for open bets until the game starts */
function updateCLV(groups){
  const m=new Map(groups.map(g=>[gk(g),g])); let ch=false;
  for(const b of BETS){
    if(b.status!=='open'||!b.evId||Date.now()>=new Date(b.commence).getTime()) continue;
    const g=m.get(b.evId+'|'+b.gkey); if(!g) continue;
    const f=fair(g), i=g.names.indexOf(b.name); if(!f||i<0) continue;
    b.closeFair=f.probs[i]; b.closeAt=Date.now(); ch=true;
  }
  if(ch) saveBets();
}
const clvPct=b=>b.closeFair!=null&&b.dEff?(b.closeFair*b.dEff-1)*100:null;

/* settle */
function settle(id,status){
  const b=BETS.find(x=>x.id===id); if(!b) return;
  b.status=status; b.settledAt=Date.now();
  b.profit=status==='won'?b.stake*((b.dEff||amToDec(b.am))-1):status==='lost'?-b.stake:0;
}
function grade(b,H,A){
  if(b.market==='h2h'){ if(H===A) return 'push'; return b.name===(H>A?b.home:b.away)?'won':'lost'; }
  if(b.market==='spreads'){ const home=b.name.startsWith(b.home+' '); const pt=home?b.point:-b.point; const mg=(home?H-A:A-H)+pt; return mg>0?'won':mg<0?'lost':'push'; }
  if(b.market==='totals'){ const t=H+A; if(t===b.point) return 'push'; return (t>b.point)===b.name.startsWith('Over')?'won':'lost'; }
  return null;
}
async function autoGrade(){
  if(!S.apiKey) return toast('Add your API key in Settings first');
  const open=BETS.filter(b=>b.status==='open'&&b.evId&&Date.now()-new Date(b.commence).getTime()>2*3600e3);
  if(!open.length) return toast('No finished games to grade yet');
  let n=0;
  for(const sp of [...new Set(open.map(b=>b.sport))]){
    try{
      const r=await fetch(`https://api.the-odds-api.com/v4/sports/${sp}/scores/?apiKey=${encodeURIComponent(S.apiKey)}&daysFrom=3`);
      if(!r.ok) continue;
      const byId=new Map((await r.json()).map(e=>[e.id,e]));
      for(const b of open.filter(b=>b.sport===sp)){
        const e=byId.get(b.evId); if(!e||!e.completed||!e.scores) continue;
        const sc=t=>parseFloat((e.scores.find(s=>s.name===t)||{}).score);
        const H=sc(b.home),A=sc(b.away); if(isNaN(H)||isNaN(A)) continue;
        const res=grade(b,H,A); if(res){ settle(b.id,res); b.final=`${b.away} ${A} – ${b.home} ${H}`; n++; }
      }
    }catch(e){}
  }
  saveBets(); renderBets(); toast(n?`Graded ${n} bet${n>1?'s':''} ✓`:'Nothing gradable yet (scores can lag a bit)');
}

/* export / backup */
function download(name,text,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }
function exportCSV(){
  const cols=['date_logged','game_time','sport','game','market','bet','book','odds','stake','status','profit','ev_at_log_pct','clv_pct','type','final'];
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows=BETS.map(b=>[new Date(b.created).toISOString(),b.commence,sportName(b.sport),b.home?`${b.away} @ ${b.home}`:'',b.label,b.name,bookName(b.book),b.am,b.stake,b.status,
    (b.profit||0).toFixed(2),b.evAtLog!=null?b.evAtLog.toFixed(2):'',clvPct(b)!=null?clvPct(b).toFixed(2):'',b.tag,b.final||''].map(q).join(','));
  download(`edge-finder-bets-${new Date().toISOString().slice(0,10)}.csv`,[cols.join(','),...rows].join('\n'),'text/csv');
}
function backup(){ download(`edge-finder-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({version:1,bets:BETS},null,1),'application/json'); }
function restore(file){
  const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); const inc=Array.isArray(d)?d:d.bets; if(!Array.isArray(inc)) throw 0;
    const have=new Set(BETS.map(b=>b.id)); const add=inc.filter(b=>b&&b.id&&!have.has(b.id)); BETS=[...add,...BETS].sort((a,b)=>b.created-a.created);
    saveBets(); renderBets(); toast(`Restored ${add.length} bet${add.length===1?'':'s'}`); }catch(e){ toast('That file isn\'t an Edge Finder backup'); } }; r.readAsText(file);
}

/* results tab */
let betsView='open';
function summarize(list){
  const st=list.filter(b=>['won','lost','push'].includes(b.status));
  const staked=st.reduce((a,b)=>a+b.stake,0), profit=st.reduce((a,b)=>a+(b.profit||0),0);
  const w=st.filter(b=>b.status==='won').length,l=st.filter(b=>b.status==='lost').length,p=st.filter(b=>b.status==='push').length;
  const clvs=list.map(clvPct).filter(v=>v!=null);
  const exp=st.filter(b=>b.evAtLog!=null).reduce((a,b)=>a+b.stake*b.evAtLog/100,0);
  return {n:st.length,staked,profit,roi:staked?profit/staked*100:0,w,l,p,clv:clvs.length?clvs.reduce((a,c)=>a+c,0)/clvs.length:null,clvN:clvs.length,beat:clvs.filter(c=>c>0).length,exp};
}
function renderBets(){
  const el=document.getElementById('v-bets'), s=summarize(BETS), sgn=v=>(v>=0?'+':'−')+money(Math.abs(v));
  const open=BETS.filter(b=>b.status==='open');
  const list=betsView==='open'?open:betsView==='settled'?BETS.filter(b=>b.status!=='open'):BETS;
  const brk=(keyFn,nameFn)=>{ const m=new Map(); BETS.forEach(b=>{ const k=keyFn(b); (m.get(k)||m.set(k,[]).get(k)).push(b); });
    const rows=[...m.entries()].map(([k,v])=>({k,s:summarize(v)})).filter(r=>r.s.n||r.s.clvN).sort((a,b)=>b.s.profit-a.s.profit);
    return rows.length?`<div class="scroll"><table><tr><th></th><th>Bets</th><th>Profit</th><th>ROI</th><th>CLV</th></tr>${rows.map(r=>`<tr><td>${esc(nameFn(r.k))}</td><td>${r.s.n}</td><td class="${r.s.profit>=0?'pos':'neg'}">${sgn(r.s.profit)}</td><td>${r.s.n?r.s.roi.toFixed(1)+'%':'–'}</td><td>${r.s.clv!=null?(r.s.clv>=0?'+':'')+r.s.clv.toFixed(1)+'%':'–'}</td></tr>`).join('')}</table></div>`:'<div class="mut">Settle a few bets to see this.</div>'; };
  el.innerHTML=`
  <div class="stats">
    <div class="stat"><div class="k">Profit</div><div class="v ${s.profit>=0?'won':'lost'}">${sgn(s.profit)}</div></div>
    <div class="stat"><div class="k">ROI</div><div class="v">${s.n?s.roi.toFixed(1)+'%':'–'}</div></div>
    <div class="stat"><div class="k">Record</div><div class="v">${s.w}-${s.l}${s.p?'-'+s.p:''}</div></div>
    <div class="stat"><div class="k">Avg CLV</div><div class="v ${s.clv!=null?(s.clv>=0?'won':'lost'):''}">${s.clv!=null?(s.clv>=0?'+':'')+s.clv.toFixed(1)+'%':'–'}</div></div>
  </div>
  ${s.n?`<div class="card"><div class="mut">Expected profit from EV: <b>${sgn(s.exp)}</b> · Actual: <b class="${s.profit>=0?'won':'lost'}">${sgn(s.profit)}</b></div>
    <div class="mut">${s.clvN?`Beat the closing line on ${s.beat} of ${s.clvN} bets. `:''}Over a few hundred bets, actual profit should drift toward expected. CLV tells you sooner.</div></div>`:''}
  <div class="btnrow" style="margin-bottom:10px">
    <button id="b_add">+ Add bet</button><button class="sec" id="b_grade">Auto-grade${open.length?` (${open.length} open)`:''}</button>
  </div>
  <div class="chips" style="padding-top:0">${[['open',`Open (${open.length})`],['settled','Settled'],['all','All']].map(([v,n])=>`<button class="chip ${betsView===v?'on':''}" data-bv="${v}">${n}</button>`).join('')}</div>
  ${list.length?list.map(betCard).join(''):`<div class="empty">${betsView==='open'?'No open bets. Tap <b>Log</b> on any +EV bet, arb or middle to add it here.':'No bets here yet.'}</div>`}
  <details class="fpanel" style="margin-top:14px"><summary>Breakdown by book</summary>${brk(b=>b.book,bookName)}</details>
  <details class="fpanel"><summary>Breakdown by sport</summary>${brk(b=>b.sport,sportName)}</details>
  <details class="fpanel"><summary>Breakdown by type</summary>${brk(b=>b.tag,k=>({ev:'+EV',arb:'Arbitrage',middle:'Middle',manual:'Manual'}[k]||k))}</details>
  <details class="fpanel"><summary>Export &amp; backup</summary>
    <div class="mut" style="margin:6px 0 10px">Your log is saved in this browser on this device. Back it up now and then. Restore merges a backup into this device.</div>
    <div class="btnrow"><button class="sec" id="b_csv">Export CSV</button><button class="sec" id="b_bak">Download backup</button>
    <label class="sec" style="display:inline-block;margin:0;padding:7px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;cursor:pointer">Restore backup<input id="b_res" type="file" accept=".json,application/json" hidden></label></div>
  </details>`;
  el.querySelectorAll('[data-bv]').forEach(b=>b.onclick=()=>{ betsView=b.dataset.bv; renderBets(); });
  document.getElementById('b_add').onclick=openManual;
  document.getElementById('b_grade').onclick=autoGrade;
  document.getElementById('b_csv').onclick=exportCSV;
  document.getElementById('b_bak').onclick=backup;
  document.getElementById('b_res').onchange=e=>{ if(e.target.files[0]) restore(e.target.files[0]); e.target.value=''; };
  el.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{ const [id,st]=b.dataset.st.split('|');
    if(st==='del'){ BETS=BETS.filter(x=>x.id!==id); }
    else if(st==='open'){ const x=BETS.find(x=>x.id===id); if(x){ x.status='open'; x.profit=0; } }
    else settle(id,st);
    saveBets(); renderBets(); });
}
function betCard(b){
  const c=clvPct(b), started=Date.now()>=new Date(b.commence).getTime();
  const pill=b.status==='open'?`<span class="pill pw">${started?'IN PLAY':'OPEN'}</span>`:b.status==='won'?`<span class="pill pg">WON ${'+'+money(b.profit)}</span>`:b.status==='lost'?`<span class="pill pl">LOST −${money(b.stake)}</span>`:`<span class="pill pw">PUSH</span>`;
  const when=new Date(b.commence).toLocaleString([], {weekday:'short',month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'});
  return `<div class="card">
    <div class="row">${pill}<span class="mut">${esc(b.label)}${b.tag!=='ev'&&b.tag!=='manual'?' · '+esc(b.tag):''}</span><span class="grow"></span>
      ${b.status==='open'?`<button class="hide" data-st="${b.id}|del">Delete</button>`:`<button class="hide" data-st="${b.id}|open">Undo</button>`}</div>
    <div class="big" style="margin-top:6px">${esc(b.name)} <span class="price">${fmtAm(b.am)}</span> <span class="mut">at ${esc(bookName(b.book))} · ${money(b.stake)}</span></div>
    <div class="mut">${b.home?`${esc(b.away)} @ ${esc(b.home)} · `:''}${esc(sportName(b.sport))} · ${when}${b.final?` · Final: ${esc(b.final)}`:''}</div>
    <div class="mut">${b.evAtLog!=null?`EV when logged ${(b.evAtLog>=0?'+':'')+b.evAtLog.toFixed(1)}%`:''}${c!=null?` · CLV <b class="${c>=0?'won':'lost'}">${(c>=0?'+':'')+c.toFixed(1)}%</b>${b.status==='open'&&!started?' (so far)':''}`:''}</div>
    ${b.status==='open'?`<div class="btnrow" style="margin-top:8px"><button class="sec" data-st="${b.id}|won">Won</button><button class="sec" data-st="${b.id}|lost">Lost</button><button class="sec" data-st="${b.id}|push">Push</button></div>`:''}
  </div>`;
}

/* ---------- tabs ---------- */
function showTab(t){
  curTab=t; renderFilters(t);
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.t===t));
  ['ev','arbs','middles','odds','bets','setup'].forEach(x=>document.getElementById('v-'+x).hidden=x!==t);
  document.getElementById('win').hidden=(t==='bets'||t==='setup');
  if(t==='setup') renderSetup();
  if(t==='bets') renderBets();
}
document.querySelectorAll('#tabs a').forEach(a=>a.onclick=e=>{e.preventDefault();showTab(a.dataset.t);});
document.getElementById('refresh').onclick=refresh;
document.getElementById('gear').onclick=()=>showTab('setup');
renderWindow(); render();
showTab(S.apiKey?'ev':'setup');
setupAuto();
</script>
</body>
</html>
